<?xml version="1.0" encoding="UTF-8"?>
<!-- Optibench Workstation - application icon (master, 1024x1024).
     Rasterised by scripts/build-icons.mjs. Sizes <= 48 px use icon-small.svg (hinted variant). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1230"/>
      <stop offset="0.55" stop-color="#18205C"/>
      <stop offset="1" stop-color="#3A1E8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="560" cy="470" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D7CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6D7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="300" y1="240" x2="740" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#C9D4FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="inner" x1="403" y1="457" x2="640" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E9E4FF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="beam" x1="40" y1="600" x2="403" y2="457" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fanFade" x1="620" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <mask id="fanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#fanFade)"/>
    </mask>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="tile">
      <rect x="40" y="40" width="944" height="944" rx="208"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="208" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- circuit trace motif -->
    <g fill="none" stroke="#3DE0FF" stroke-opacity="0.42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M118 790 H236 L280 746 H372"/>
      <path d="M118 852 H318 L352 818 H470"/>
    </g>
    <g fill="#3DE0FF" fill-opacity="0.6">
      <circle cx="372" cy="746" r="15"/>
      <circle cx="470" cy="818" r="15"/>
    </g>

    <!-- incoming white beam -->
    <path d="M0 616 L403 457" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="56" filter="url(#blur)"/>
    <path d="M0 616 L403 457" stroke="url(#beam)" stroke-width="22" stroke-linecap="round"/>

    <!-- spectral fan (red = least deviated ... violet = most) -->
    <g mask="url(#fanMask)">
      <g filter="url(#blur)" opacity="0.55">
        <polygon points="612,438 644,503 1024,980 1024,470" fill="#9A7BFF"/>
      </g>
      <polygon points="612.3,437.9 616.9,447.3 1024,532 1024,470" fill="#FF3B5C"/>
      <polygon points="616.9,447.3 621.4,456.6 1024,596 1024,532" fill="#FF8A3D"/>
      <polygon points="621.4,456.6 626.0,466.0 1024,662 1024,596" fill="#FFD23F"/>
      <polygon points="626.0,466.0 630.6,475.4 1024,730 1024,662" fill="#4BE37A"/>
      <polygon points="630.6,475.4 635.1,484.7 1024,800 1024,730" fill="#3DE0FF"/>
      <polygon points="635.1,484.7 639.7,494.1 1024,872 1024,800" fill="#4A7BFF"/>
      <polygon points="639.7,494.1 644.2,503.4 1024,946 1024,872" fill="#8B5CFF"/>
    </g>
  </g>

  <!-- glass prism -->
  <polygon points="512,232 284,700 740,700" fill="url(#glass)"/>
  <!-- refracted beam inside the glass -->
  <polygon points="403,457 612.3,437.9 644.2,503.4" fill="url(#inner)"/>
  <!-- left facet highlight -->
  <polygon points="512,232 284,700 340,700 512,318" fill="#FFFFFF" fill-opacity="0.12"/>
  <!-- edges -->
  <polygon points="512,232 284,700 740,700" fill="none" stroke="#F2F5FF" stroke-width="16" stroke-linejoin="round"/>
  <path d="M500 268 L318 642" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <circle cx="512" cy="238" r="10" fill="#FFFFFF"/>

  <!-- top sheen and hairline edge -->
  <rect x="40" y="40" width="944" height="944" rx="208" fill="url(#sheen)"/>
  <rect x="42" y="42" width="940" height="940" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
</svg>
